name: CI (static)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  static:
    name: Static check
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check required files exist
        run: |
          test -f index.html && echo "index.html OK"
          test -s index.html && echo "index.html non-empty"

      - name: Verify local asset references in HTML exist
        run: |
          set -euo pipefail
          # Collect local (non-URL, non-anchor) src/href targets from index.html
          grep -oE '(src|href)="[^"]+"' index.html \
            | sed -E 's/^(src|href)="([^"]+)"/\2/' \
            | grep -vE '^(https?://|#|mailto:|data:)' \
            | sort -u > /tmp/refs.txt || true
          if [ ! -s /tmp/refs.txt ]; then echo "no local asset refs"; exit 0; fi
          while IFS= read -r f; do
            if [ ! -f "$f" ]; then echo "MISSING asset: $f"; exit 1; fi
            echo "asset OK: $f"
          done < /tmp/refs.txt

      - name: Verify CSS background assets referenced exist
        run: |
          set -euo pipefail
          grep -oE "url\(['\"]?[^)'\"]+['\"]?\)" index.html \
            | sed -E "s/url\(['\"]?([^)'\"]+)['\"]?\)/\1/" \
            | grep -vE '^(https?:|data:)' \
            | sort -u > /tmp/cssrefs.txt || true
          if [ ! -s /tmp/cssrefs.txt ]; then echo "no local css asset refs"; exit 0; fi
          while IFS= read -r f; do
            if [ ! -f "$f" ]; then echo "MISSING css asset: $f"; exit 1; fi
            echo "css asset OK: $f"
          done < /tmp/cssrefs.txt

      - name: Check Python imports (pylint)
        run: |
          set -euo pipefail
          # Find all .py files in the repo (excluding hidden dirs and design-evals if needed)
          PY_FILES=$(find . -name '*.py' -not -path './.hermes/*' -not -path './__pycache__/*' -not -path './design-evals/*' | sort)
          if [ -z "$PY_FILES" ]; then
            echo "No .py files to check"
            exit 0
          fi
          pip install pylint --quiet 2>/dev/null
          # Run pylint once and keep only import-related messages (clean output).
          import_errors="$(
            python -m pylint \
              --disable=C,R,W \
              --enable=E0401,E0602,E0611 \
              --score=n \
              --reports=n \
              $PY_FILES 2>&1 \
              | grep -E 'E0401|E0602|E0611' || true
          )"
          if [ -n "$import_errors" ]; then
            echo "Pylint import errors found (E0401/E0602/E0611):"
            echo "$import_errors"
            exit 1
          fi

  visual:
    name: UI Pixel Validation
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ github.job }}-py3.11
          restore-keys: |
            ${{ runner.os }}-pip-${{ github.job }}-

      - name: Install dependencies
        run: |
          pip install pip --upgrade
          pip install pyyaml playwright

      - name: Install Chromium (Playwright)
        run: python -m playwright install chromium

      - name: Run UI pixel validation (screenshots + token check)
        run: python design-evals/validate.py --strict

      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshots
          path: design-evals/screenshots/
          retention-days: 14