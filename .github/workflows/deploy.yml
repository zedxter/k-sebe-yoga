name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy static site
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Prepare site archive
        run: |
          tar czf /tmp/site.tar.gz \
            --exclude='deploy/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='.hermes/' \
            --exclude='openspec/' \
            --exclude='research/' \
            --exclude='AGENTS.md' \
            --exclude='DESIGN.md' \
            --exclude='README.md' \
            --exclude='product-standards.md' \
            --exclude='_qa_*' \
            --exclude='qa-visual-test.html' \
            .

      - name: Copy site tarball to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "/tmp/site.tar.gz"
          target: /tmp/
          strip_components: 0

      - name: Extract site content on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            rm -rf /var/www/k-sebe-yoga/* /var/www/k-sebe-yoga/.[!.]*
            tar xzf /tmp/site.tar.gz -C /var/www/k-sebe-yoga/
            rm /tmp/site.tar.gz

      - name: Copy deploy config to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "deploy/Caddyfile,deploy/k-sebe-yoga.service"
          target: /etc/caddy/sites/k-sebe-yoga
          strip_components: 0

      - name: Reload Caddy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            sudo systemctl daemon-reload
            sudo systemctl reload-or-restart k-sebe-yoga