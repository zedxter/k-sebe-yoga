name: Branch Guard — PR-only main

on:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check if push came from a PR merge
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha
            });

            const mergedPR = prs.data.find(p => p.merged_at !== null);

            if (mergedPR) {
              core.notice(`PR #${mergedPR.number} merged — allowed`);
              core.setOutput('status', 'pass');
            } else {
              core.setOutput('status', 'fail');
            }

      - name: Mark status (fail on direct push)
        if: steps.check.outputs.status == 'fail'
        uses: actions/github-script@v7
        with:
          script: |
            core.warning('Direct push detected — all changes must go through PRs');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'Branch Guard (PR-only)',
              description: 'Direct push to main blocked — use PRs only'
            });
