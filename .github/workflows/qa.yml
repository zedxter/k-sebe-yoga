name: QA (contrast & var check)

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: qa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  qa-checks:
    name: Contrast + var reference
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run WCAG contrast check (reads CSS vars from design.css)
        run: python _qa_contrast.py design.css

      - name: Run CSS var() reference check (scans all .css files)
        run: python _qa_varcheck.py
